<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindTrack - Rate your day</title>
    <link rel="stylesheet" href="css/reporte02.css">
    <link rel="stylesheet" href="css/status-bar.css">
    <link rel="stylesheet" href="css/phone-frame.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="phone">

        <div class="status-bar">
        <span class="status-time">12:01</span>

        <div class="status-icons">
            <span>
                <iconify-icon icon="pinhead:phone-bars"></iconify-icon>
            </span>

            <span>
                <iconify-icon icon="material-symbols:wifi"></iconify-icon>
            </span>

            <span>
                <iconify-icon icon="ic:baseline-battery-80"></iconify-icon>
            </span>
        </div>
    </div>

        <!-- Header -->
        <header class="header">
            
            <img src="img/MindTrack-Logo.png" alt="MindTrack" class="logo">

            <div class="iconp">
                <a href="settings.html"><iconify-icon icon="solar:user-outline" class="icon1"></iconify-icon></a>
            </div>
            
        </header>

    <main>

        <div class="back-button">
            <a href="Reporte01.html">
                <iconify-icon icon="material-symbols-light:arrow-back-rounded"></iconify-icon>
            </a>
        </div>

        <h1>Rate your day</h1>
        <p class="subtitle">How intense were these emotions today?</p>

        <div class="emotion">

            <label>Stress</label>

            <input type="range" min="0" max="100">

            <div class="levels">
                <span>Low</span>
                <span>High</span>
            </div>

        </div>

        <div class="emotion">

            <label>Sleep Quality</label>

            <input type="range" min="0" max="100">

            <div class="levels">
                <span>Low</span>
                <span>High</span>
            </div>

        </div>

        <div class="emotion">

            <label>Energy</label>

            <input type="range" min="0" max="100">

            <div class="levels">
                <span>Low</span>
                <span>High</span>
            </div>

        </div>

        <div class="emotion">

            <label>Appetite</label>

            <input type="range" min="0" max="100">

            <div class="levels">
                <span>Low</span>
                <span>High</span>
            </div>

        </div>

        

    </main>



     <footer class="footer">

            <a href="Reporte03.html"><button class="continue">
                Continue
            </button></a>

            <span class="page">
                2/5
            </span>

            <nav class="bottom-nav">

                <a href="home.html">
                <iconify-icon icon="fa7-regular:home"></iconify-icon>
                </a>
                <a href="estadisticas.html">
                <iconify-icon icon="material-symbols-light:bar-chart-4-bars"></iconify-icon>
                </a>

                <a href="agendar-cita.html">
                    <iconify-icon icon="griddy-icons:calendar"></iconify-icon>
                </a>
            </nav>

        </footer>

</div>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</body>
</html>
