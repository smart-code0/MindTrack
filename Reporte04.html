<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindTrack</title>

    <link rel="stylesheet" href="css/reporte04.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="app">

        <div class="phone">

        <div class="status-bar">
        <span class="status-time">12:01</span>

        <div class="status-icons">
            <span>
                <iconify-icon icon="pinhead:phone-bars"></iconify-icon>
            </span>

            <span>
                <iconify-icon icon="material-symbols:wifi"></iconify-icon>
            </span>

            <span>
                <iconify-icon icon="ic:baseline-battery-80"></iconify-icon>
            </span>
        </div>
        </div>

            <header class="header">

    <img src="img/MindTrack-Logo.png" alt="MindTrack" class="logo">

                <button class="iconp">
                    <a href="settings.html">
                        <iconify-icon icon="solar:user-outline"></iconify-icon>
                    </a>
                </button>

            </header>

            <section class="content">

                <button class="icon">
                    <a href="Reporte03.html">
                        <iconify-icon icon="material-symbols-light:arrow-back-rounded"></iconify-icon>
                    </a>
                </button>

                <div class="question-header">

                    <div class="question">

                        <h1>
                            How did you cope today?
                        </h1>

                        <p>
                            Select everything that applies.
                        </p>

                    </div>

    </div>


            <div class="options">


                <input type="checkbox" id="outdoors">

                <label for="outdoors">
                    Outdoors
                </label>



                <input type="checkbox" id="rest">

                <label for="rest">
                    Rest
                </label>



                <input type="checkbox" id="medication">

                <label for="medication">
                    Medication
                </label>



                <input type="checkbox" id="meditation">

                <label for="meditation">
                    Meditation
                </label>



                <input type="checkbox" id="exercise">

                <label for="exercise">
                    Exercise
                </label>



                <input type="checkbox" id="talked">

                <label for="talked">
                    Talked
                </label>



                <input type="checkbox" id="therapy">

                <label for="therapy">
                    Therapy
                </label>



                <input type="checkbox" id="journal">

                <label for="journal">
                    Journal
                </label>



                <input type="checkbox" id="music">

                <label for="music">
                    Music
                </label>



                <input type="checkbox" id="family">

                <label for="family">
                    Family
                </label>


            </div>


            <input type="checkbox" id="none">

            <label for="none" class="none">
                None of these
            </label>

            <div class="bottom">

                <a href="Reporte05.html"><button>
                    Continue
                </button></a>

                <span>
                    4/5
                </span>

            </div>


        </section>

    <nav class="bottom-nav">

                <a href="home.html">
                <iconify-icon icon="fa7-regular:home"></iconify-icon>
                </a>
                <a href="estadisticas.html">
                <iconify-icon icon="material-symbols-light:bar-chart-4-bars"></iconify-icon>
                </a>

                <a href="agendar-cita.html">
                    <iconify-icon icon="griddy-icons:calendar"></iconify-icon>
                </a>
            </nav>
</main>
 <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</body>

</html>
