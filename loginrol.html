<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindTrack</title>

    <link rel="stylesheet" href="css/loginrol.css">
    <link rel="stylesheet" href="css/status-bar.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="phone">

        <!-- STATUS BAR -->

        <div class="status-bar">

            <span class="status-time">12:01</span>

            <div class="status-icons">

                <span><iconify-icon icon="pinhead:phone-bars"></iconify-icon></span>
                <span><iconify-icon icon="material-symbols:wifi"></iconify-icon></span>
                <span><iconify-icon icon="ic:baseline-battery-80"></iconify-icon></span>

            </div>

        </div>

        <!-- LOGO -->

        <header>

            <img src="img/MindTrack-Logo.png" class="MindTrack">

        </header>

        <!-- CONTENIDO -->

        <main>

            <h1>What is your role?</h1>

            <p class="subtitle">

                Customize your MindTrack experience
                <br>
                based on how you plan to use it.

            </p>

            <!-- OPCION 1 -->

            <div class="role-card selected">

                <div class="role-icon">

                    <iconify-icon icon="mdi:account-heart"></iconify-icon>

                </div>

                <div class="role-info">

                    <h3>Patient</h3>

                    <p>

                        Customize your MindTrack experience
                        based on how you plan to use it.

                    </p>

                </div>

            </div>

            <!-- OPCION 2 -->

            <div class="role-card">

                <div class="role-icon">

                    <iconify-icon icon="mdi:doctor"></iconify-icon>

                </div>

                <div class="role-info">

                    <h3>Psychologist/therapist</h3>

                    <p>

                        I want to monitor my patients'
                        progress and manage appointments.

                    </p>

                </div>

            </div>

            <button class="continue-btn">

                Continue

            </button>

        </main>

    </div>

    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

</body>

</html>
