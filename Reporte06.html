<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindTrack</title>

    <link rel="stylesheet" href="css/reporte06.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="phone">

        <!-- Barra de estado -->

        <div class="status-bar">

            <span class="time">12:01</span>

           <div class="status-icons">
            <span>
                <iconify-icon icon="pinhead:phone-bars"></iconify-icon>
            </span>

            <span>
                <iconify-icon icon="material-symbols:wifi"></iconify-icon>
            </span>

            <span>
                <iconify-icon icon="ic:baseline-battery-80"></iconify-icon>
            </span>
        </div>
        </div>

        <!-- Header -->

        <header>

            <img src="img/MindTrack-Logo.png" alt="MindTrack">

            <button class="iconp">

                <a href="settings.html">

                    <iconify-icon
                        icon="solar:user-outline"
                        class="icon1">
                    </iconify-icon>

                </a>

            </button>

        </header>

        <!-- Contenido -->

        <main>

            <section class="success-card">

                <div class="check-circle">

                    <i class="fa-solid fa-check"></i>

                </div>

                <h2>Daily log completed!</h2>

                <p>

                    Thank you for taking the time
                    <br>
                    to reflect on your day.

                </p>

                <p>

                    Your information has been saved
                    <br>
                    and will help you and your care
                    <br>
                    team monitor your progress.

                </p>

            </section>

            <a href="home.html"><button class="home-btn">

                Go Home

            </button>
            </a>

        </main>

        <!-- Bottom Navigation -->

       <nav class="bottom-nav">

    <a href="home.html">
        <iconify-icon icon="fa7-regular:home"></iconify-icon>
    </a>

    <a href="estadisticas.html">
        <iconify-icon icon="material-symbols-light:bar-chart-4-bars"></iconify-icon>
    </a>

    <a href="agendar-cita.html">
        <iconify-icon icon="griddy-icons:calendar"></iconify-icon>
    </a>

</nav>

    </div>
<script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</body>

</html>
