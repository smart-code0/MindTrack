<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/status-bar.css">
    <link rel="stylesheet" href="css/phone-frame.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="profile">

    <div class="status-bar">
        <span class="status-time">12:01</span>
        <div class="status-icons">
            <span><iconify-icon icon="pinhead:phone-bars"></iconify-icon></span>
            <span><iconify-icon icon="material-symbols:wifi"></iconify-icon></span>
            <span><iconify-icon icon="ic:baseline-battery-80"></iconify-icon></span>
        </div>
    </div>

    <div class="header">

       <div class="arrow">
                <a href="home.html">
                <iconify-icon icon="material-symbols-light:arrow-back-rounded"></iconify-icon>
                </a>
            </div>

        
        <div class="avatar">
            WV
        </div>

        <h2>Williams Vanegas</h2>

        <span class="badge">
            pacient
        </span>

        <p class="member">
            member since June 26
        </p>

    </div>

    <div class="stats">

        <div class="item">
            <h3>14</h3>
            <span>Recorded days</span>
        </div>

        <div class="divider"></div>

        <div class="item">
            <h3 class="green-text">6.3</h3>
            <span>Average energy</span>
        </div>

    </div>

    <div class="content">

        <h4>ACCOUNT</h4>

        <div class="card">

            <div class="row">

                <div class="left">

                    <div class="icon purple">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <div>
                        <strong>Edit profile</strong>
                        <small>will@gmail.com</small>
                    </div>

                </div>

                <i class="fa-solid fa-chevron-right"></i>

            </div>

            <hr>

            <div class="row">

                <div class="left">

                    <div class="icon orange">
                        <i class="fa-regular fa-bell"></i>
                    </div>

                    <div>
                        <strong>Notifications</strong>
                        <small>Manage reminders</small>
                    </div>

                </div>

                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>

            </div>

        </div>

        <h4>DATA</h4>

        <div class="card">

            <div class="row"> 

                <div class="left">

                    <div class="icon green-bg">
                        <iconify-icon icon="mi:document"></iconify-icon>

                    </div>


                    <div>
                        <strong>Export history</strong>
                        <small>Download PDF</small>
                    </div>

                </div>

                <i class="fa-solid fa-chevron-right"></i>

            </div>

            <hr>

            <div class="row">

                <div class="left">

                    <div class="icon violet">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>

                    <div>
                        <strong>Privacy and security</strong>
                    </div>

                </div>

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </div>

        <h4>SUPPORT</h4>

        <div class="card">

            <div class="row">

                <div class="left">

                    <div class="icon blue">
                        <i class="fa-regular fa-circle-question"></i>
                    </div>

                    <div>
                        <strong>Help Center</strong>
                    </div>

                </div>

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </div>

        <a href="index.html" ><button class="logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            LOG OUT
        </button>
    </a>
    </div>

</div>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</body>
</html>
