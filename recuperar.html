<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindTrack | Recover Password</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/recuperar.css">

    <!-- ICONOS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>

<body>

    <!-- TELEFONO -->
    <div class="phone-frame">

        <div class="status-bar">

    <span class="status-time">12:01</span>

    <div class="status-icons">

        <span>
            <iconify-icon icon="pinhead:phone-bars"></iconify-icon>
        </span>

        <span>
            <iconify-icon icon="material-symbols:wifi"></iconify-icon>
        </span>

        <span>
            <iconify-icon icon="ic:baseline-battery-80"></iconify-icon>
        </span>

    </div>

</div>


        <!-- PANTALLA -->
        <main class="screen">


            <!-- PARTE SUPERIOR -->
            <section class="hero">

                <img
                    src="img/MindTrack-Logo.png"
                    alt="MindTrack"
                    class="logo"
                >

                <h1>Forgot your password?</h1>

                <p>
                    Enter your email and we'll send you<br>
                    a link to reset your password.
                </p>

            </section>


            <!-- TARJETA -->
            <section class="card">


                <!-- EMAIL -->
                <label for="email">
                    Email
                </label>

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="youremail@gmail.com"
                    >

                </div>


                <!-- BOTON -->
                <button class="send-button">

                    <span>Send reset link</span>

                    <i class="fa-regular fa-paper-plane"></i>

                </button>


                <!-- SEPARADOR -->
                <div class="divider">

                    <span></span>

                    <p>Or</p>

                    <span></span>

                </div>


                <!-- INFORMACION -->
                <div class="info-box">

                    <div class="lock-circle">

                        <i class="fa-solid fa-lock"></i>

                    </div>

                    <p>
                        We'll send a secure link to your email
                        to help you create a new password.
                    </p>

                </div>


                <!-- VOLVER -->
                <a href="index.html" class="back-login">

                    <i class="fa-solid fa-arrow-left"></i>

                    <span>Back to login</span>

                </a>


            </section>

        </main>

        </div>

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

</body>

</html>
