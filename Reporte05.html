<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindTrack</title>

    <link rel="stylesheet" href="css/reporte05.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

    <main class="app">

        <div class="phone">

        <div class="status-bar">
        <span class="status-time">12:01</span>

        <div class="status-icons">
            <span>
                <iconify-icon icon="pinhead:phone-bars"></iconify-icon>
            </span>

            <span>
                <iconify-icon icon="material-symbols:wifi"></iconify-icon>
            </span>

            <span>
                <iconify-icon icon="ic:baseline-battery-80"></iconify-icon>
            </span>
        </div>
        </div>

        <!-- HEADER -->

        <header class="header">

            <img
                src="img/MindTrack-Logo.png"
                alt="MindTrack"
                class="logo"
            >

            <button class="iconp">

                <a href="settings.html">

                    <iconify-icon
                        icon="solar:user-outline"
                        class="icon1">
                    </iconify-icon>

                </a>

            </button>

        </header>


        <!-- CONTENIDO -->

        <section class="content">


            <!-- FLECHA -->

            <button class="icon">

                <a href="Reporte04.html">

                    <iconify-icon
                        icon="material-symbols-light:arrow-back-rounded">
                    </iconify-icon>

                </a>

            </button>


            <!-- PREGUNTA -->

            <div class="question-header">

                <div class="question">

                    <h1>
                        Before you finish...
                    </h1>

                    <p>
                        What is one thing you are proud of today?
                    </p>

                </div>

            </div>


            <!-- CAJA DE TEXTO -->

            <div class="textarea-container">

                <textarea
                    maxlength="100"
                    placeholder="i feel proud of make new friends today in the library..."
                ></textarea>

                <div class="textarea-bottom">

                    <span>
                        0/100
                    </span>

                    <button class="microphone" type="button">

                        <iconify-icon
                            icon="solar:microphone-outline">
                        </iconify-icon>

                    </button>

                </div>

            </div>


            <!-- SLIDER -->

            <div class="hope-section">

                <p class="hope-question">
                    How hopeful do you feel about tomorrow?
                </p>

                <div class="slider-container">

                    <input
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>

                <div class="slider-labels">

                    <span>Low</span>

                    <span>High</span>

                </div>

            </div>


            <!-- PARTE INFERIOR -->

            <div class="bottom">

                <a href="Reporte06.html"><button class="finish-button">
                    Finish
                </button>
                </a>

                <span>
                    5/5
                </span>

            </div>

        </section>


        <!-- FOOTER -->

        <nav class="bottom-nav">

                <a href="home.html">
                <iconify-icon icon="fa7-regular:home"></iconify-icon>
                </a>
                <a href="estadisticas.html">
                <iconify-icon icon="material-symbols-light:bar-chart-4-bars"></iconify-icon>
                </a>

                <a href="agendar-cita.html">
                    <iconify-icon icon="griddy-icons:calendar"></iconify-icon>
                </a>
            </nav>

    </main>


    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

</body>

</html>
